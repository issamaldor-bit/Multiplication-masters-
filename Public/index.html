<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Masters</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f8f4;color:#173b2a}header{background:#14532d;color:white;padding:20px;text-align:center}main{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 3px 15px #0001}input,select,button{font-size:18px;padding:12px;margin:6px;border-radius:10px;border:1px solid #bbb}button{background:#f59e0b;color:#fff;border:0;cursor:pointer}.hidden{display:none}.q{font-size:60px;text-align:center;margin:30px}.timer{text-align:center;font-size:30px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{font-size:28px;background:#166534}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.tabs button{background:#14532d}.medal{font-size:28px}</style></head><body><header><h1>🏆 Multiplication Masters Challenge</h1><p>Grades 4–5 • Tables 2–12</p></header><main>
<div id="home" class="card"><h2>Student Registration</h2><input id="sid" placeholder="Student ID"><input id="name" placeholder="Full Name"><select id="grade"><option>Grade 4</option><option>Grade 5</option></select><input id="cls" placeholder="Class / Section"><input id="teacher" placeholder="Teacher"><br><button onclick="register()">Register</button><button onclick="showTeacher()">Teacher Dashboard</button><p id="regmsg"></p></div>
<div id="game" class="card hidden"><div class="timer">⏱ <span id="timer">05:00</span></div><p id="progress"></p><div id="question" class="q"></div><div class="grid"><button onclick="ans(1)">1</button><button onclick="ans(2)">2</button><button onclick="ans(3)">3</button><button onclick="ans(4)">4</button><button onclick="ans(5)">5</button><button onclick="ans(6)">6</button><button onclick="ans(7)">7</button><button onclick="ans(8)">8</button><button onclick="ans(9)">9</button><button onclick="ans(0)">0</button><button onclick="backspace()">⌫</button><button onclick="submitAnswer()">✓</button></div><input id="answer" style="width:90%;text-align:center" placeholder="Your answer" readonly></div>
<div id="result" class="card hidden"></div>
<div id="teacher" class="card hidden"><h2>Teacher Dashboard</h2><input id="pin" type="password" placeholder="PIN"><button onclick="login()">Login</button><div id="dash"></div></div></main><script>
let state={questions:[],i:0,answers:[],currentStart:0,attemptId:null,studentId:null,timer:null};
async function register(){const body={id:sid.value.trim(),name:name.value.trim(),grade:grade.value,className:cls.value,teacher:teacher.value};const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)return regmsg.textContent=d.error;state.studentId=body.id;regmsg.innerHTML=`Registered! Code: <b>${d.registrationCode}</b><br><button onclick="start()">Start Competition</button>`}
async function start(){const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId:state.studentId})});const d=await r.json();if(!r.ok)return alert(d.error);state={...state,attemptId:d.attemptId,questions:d.questions,i:0,answers:[],currentStart:Date.now()};home.classList.add('hidden');game.classList.remove('hidden');render();let left=d.timeLimit;state.timer=setInterval(()=>{left--;timer.textContent=new Date(left*1000).toISOString().substr(14,5);if(left<=0){clearInterval(state.timer);finish()}},1000)}
function render(){progress.textContent=`Question ${state.i+1} of ${state.questions.length}`;question.textContent=`${state.questions[state.i].a} × ${state.questions[state.i].b} = ?`;answer.value='';state.currentStart=Date.now()}
function ans(n){answer.value+=n}function backspace(){answer.value=answer.value.slice(0,-1)}function submitAnswer(){if(answer.value==='')return;const q=state.questions[state.i];state.answers.push({qIndex:state.i+1,answer:Number(answer.value),correctAnswer:q.a*q.b,timeSpent:(Date.now()-state.currentStart)/1000});if(state.i<state.questions.length-1){state.i++;render()}else finish()}
async function finish(){clearInterval(state.timer);for(;state.i<state.questions.length;state.i++){const q=state.questions[state.i];if(!state.answers.find(x=>x.qIndex===state.i+1))state.answers.push({qIndex:state.i+1,answer:NaN,correctAnswer:q.a*q.b,timeSpent:0})}const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attemptId:state.attemptId,answers:state.answers})});const d=await r.json();game.classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<h2>🎉 Congratulations!</h2><h3>Score: ${d.score}%</h3><p>Correct: ${d.correct} | Incorrect: ${d.incorrect}</p><p>Accuracy: ${d.accuracy.toFixed(1)}%</p><p>Time: ${d.totalTime.toFixed(1)} seconds</p><p>Rank: <b>#${d.rank}</b></p>`}
function showTeacher(){home.classList.add('hidden');teacher.classList.remove('hidden')}async function login(){if(pin.value!=='1234')return alert('Incorrect PIN');const r=await fetch('/api/results');const rows=await r.json();dash.innerHTML=`<button onclick="exportX()">Export Results to Excel</button><h3>🏆 Live Leaderboard</h3><table class="table"><tr><th>Rank</th><th>Student</th><th>Grade</th><th>Class</th><th>Correct</th><th>Accuracy</th><th>Time</th><th>Score</th></tr>${rows.map((x,i)=>`<tr><td class="medal">${i<3?['🥇','🥈','🥉'][i]:x.rank}</td><td>${x.name}</td><td>${x.grade}</td><td>${x.className||''}</td><td>${x.correct}/${x.correct+x.incorrect}</td><td>${x.accuracy.toFixed(1)}%</td><td>${x.totalTime.toFixed(1)}s</td><td>${x.score}</td></tr>`).join('')}</table>`}async function exportX(){const rows=await(await fetch('/api/export')).json();const csv=[Object.keys(rows[0]||{Attempt_ID:'',Student_ID:'',Student_Name:'',Grade:'',Class:'',Teacher:'',Start_Time:'',End_Time:'',Total_Time_Seconds:'',Total_Correct:'',Total_Incorrect:'',Accuracy_Percent:'',Final_Score:''}).join(','),...rows.map(r=>Object.values(r).map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Multiplication_Masters_Results.csv';a.click();alert('Exported.Open the CSV in Excel.')}
</script></body></html>
